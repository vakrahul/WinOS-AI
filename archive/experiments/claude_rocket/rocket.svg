<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="spaceGrad" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#0d1326"/>
      <stop offset="100%" stop-color="#05070f"/>
    </radialGradient>

    <!-- Hull Gradient -->
    <linearGradient id="hullGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f5f5f8"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="85%" stop-color="#d7dae1"/>
      <stop offset="100%" stop-color="#b0b5c2"/>
    </linearGradient>

    <!-- Nose Cone Gradient -->
    <linearGradient id="noseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e63946"/>
      <stop offset="50%" stop-color="#ff4d5a"/>
      <stop offset="100%" stop-color="#ba1825"/>
    </linearGradient>

    <!-- Fin Gradient -->
    <linearGradient id="finGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f77f00"/>
      <stop offset="100%" stop-color="#d62828"/>
    </linearGradient>

    <!-- Flame Gradients -->
    <linearGradient id="flameOuterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff7b00"/>
      <stop offset="100%" stop-color="#e63946"/>
    </linearGradient>
    <linearGradient id="flameInnerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffdd00"/>
      <stop offset="100%" stop-color="#ff9e00"/>
    </linearGradient>

    <!-- Window Glass -->
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#70e000"/>
      <stop offset="0%" stop-color="#48cae4"/>
      <stop offset="100%" stop-color="#0077b6"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Deep Space Backdrop -->
  <rect width="1600" height="900" fill="url(#spaceGrad)"/>

  <!-- Celestial Elements -->
  <!-- Crescent Moon -->
  <g transform="translate(1180, 180)">
    <path d="M 0,-45 A 45 45 0 1 0 45,0 A 38 38 0 1 1 0,-45 Z" fill="#e2eafc" filter="url(#glow)"/>
  </g>

  <!-- Ringed Planet (Saturn) -->
  <g transform="translate(380, 200)">
    <circle cx="0" cy="0" r="32" fill="#adb5bd"/>
    <!-- Planet body outline -->
    <circle cx="0" cy="0" r="32" fill="none" stroke="#6c757d" stroke-width="2"/>
    <!-- Ring -->
    <ellipse cx="0" cy="0" rx="68" ry="18" fill="none" stroke="#ced4da" stroke-width="3" transform="rotate(-25)"/>
  </g>

  <!-- Sparkling Stars -->
  <g fill="#ffd166" stroke="#ffffff" stroke-width="0.5">
    <path d="M 320,380 L 324,374 L 330,370 L 324,366 L 320,360 L 316,366 L 310,370 L 316,374 Z"/>
    <path d="M 1250,330 L 1254,324 L 1260,320 L 1254,316 L 1250,310 L 1246,316 L 1240,320 L 1246,324 Z"/>
    <path d="M 460,120 L 463,115 L 468,112 L 463,109 L 460,104 L 457,109 L 452,112 L 457,115 Z"/>
    <path d="M 1120,480 L 1124,474 L 1130,470 L 1124,466 L 1120,460 L 1116,466 L 1110,470 L 1116,474 Z"/>
    <path d="M 520,580 L 523,575 L 528,572 L 523,569 L 520,564 L 517,569 L 512,572 L 517,575 Z"/>
    <circle cx="280" cy="240" r="2" fill="#fff"/>
    <circle cx="1340" cy="220" r="2.5" fill="#fff"/>
    <circle cx="420" cy="500" r="2" fill="#fff"/>
    <circle cx="1220" cy="620" r="2.5" fill="#fff"/>
    <circle cx="620" cy="180" r="1.5" fill="#fff"/>
    <circle cx="980" cy="150" r="1.5" fill="#fff"/>
  </g>

  <!-- CENTER ROCKET ORIGIN: (800, 420) -->
  <g id="RocketGroup" transform="translate(800, 420)">

    <!-- 1. Fiery Exhaust Plume & Thrust -->
    <g id="ThrusterFlames" filter="url(#glow)">
      <!-- Outer Flame -->
      <polygon points="-55,155 -95,235 -45,285 0,390 45,285 95,235 55,155" fill="url(#flameOuterGrad)" stroke="#1a1a1a" stroke-width="2"/>
      <!-- Mid Flame -->
      <polygon points="-38,158 -55,230 -25,265 0,335 25,265 55,230 38,158" fill="url(#flameInnerGrad)" stroke="#1a1a1a" stroke-width="1.5"/>
      <!-- Inner Core -->
      <polygon points="-20,160 -22,215 0,270 22,215 20,160" fill="#ffffff"/>
      <!-- Sparks -->
      <circle cx="-65" cy="320" r="5" fill="#ffdd00"/>
      <circle cx="60" cy="330" r="4.5" fill="#ffdd00"/>
      <circle cx="-25" cy="410" r="3.5" fill="#ffdd00"/>
      <circle cx="20" cy="420" r="4" fill="#ffdd00"/>
      <circle cx="0" cy="435" r="5" fill="#ffdd00"/>
    </g>

    <!-- 2. Aerodynamic Booster Wings / Fins -->
    <!-- Left Fin -->
    <g id="LeftFin">
      <polygon points="-75,25 -195,165 -150,195 -78,145" fill="url(#finGrad)" stroke="#1a1a1a" stroke-width="3" stroke-linejoin="round"/>
      <!-- Fin Highlight Ridge -->
      <line x1="-80" y1="45" x2="-170" y2="175" stroke="#ffaa00" stroke-width="3"/>
    </g>

    <!-- Right Fin -->
    <g id="RightFin">
      <polygon points="75,25 195,165 150,195 78,145" fill="url(#finGrad)" stroke="#1a1a1a" stroke-width="3" stroke-linejoin="round"/>
      <!-- Fin Shadow Ridge -->
      <line x1="80" y1="45" x2="170" y2="175" stroke="#b01f1f" stroke-width="3"/>
    </g>

    <!-- 3. Engine Nozzle -->
    <polygon points="-52,140 -62,172 62,172 52,140" fill="#495057" stroke="#1a1a1a" stroke-width="3"/>
    <line x1="-58" y1="156" x2="58" y2="156" stroke="#adb5bd" stroke-width="2"/>

    <!-- 4. Main Fuselage Body -->
    <!-- Curved fuselage path with bulging side walls -->
    <path d="M 0,-120 
             C -86,-90 -88,10 -84,80 
             L -80,105 L -78,140 
             L 78,140 L 80,105 L 84,80 
             C 88,10 86,-90 0,-120 Z" 
          fill="url(#hullGrad)" stroke="#1a1a1a" stroke-width="3" stroke-linejoin="round"/>

    <!-- Horizontal Panel Lines -->
    <line x1="-82" y1="80" x2="82" y2="80" stroke="#1a1a1a" stroke-width="2"/>
    <line x1="-80" y1="105" x2="80" y2="105" stroke="#1a1a1a" stroke-width="2"/>

    <!-- Center Stabilizer Rib -->
    <line x1="0" y1="30" x2="0" y2="138" stroke="#1a1a1a" stroke-width="3"/>

    <!-- 5. Aerodynamic Crimson Nose Cone -->
    <path d="M 0,-260 
             C -35,-210 -72,-160 -78,-120 
             L 78,-120 
             C 72,-160 35,-210 0,-260 Z" 
          fill="url(#noseGrad)" stroke="#1a1a1a" stroke-width="3" stroke-linejoin="round"/>
    <!-- Specular Highlight Line on Nose -->
    <path d="M -15,-230 C -30,-190 -45,-155 -52,-130" stroke="#ff99a8" stroke-width="3" fill="none"/>

    <!-- 6. Dual Porthole Viewport Windows -->
    <!-- Upper Window -->
    <g transform="translate(0, -35)">
      <!-- Frame -->
      <circle cx="0" cy="0" r="38" fill="#6c757d" stroke="#1a1a1a" stroke-width="3"/>
      <!-- Glass -->
      <circle cx="0" cy="0" r="28" fill="url(#glassGrad)" stroke="#1a1a1a" stroke-width="2"/>
      <!-- Glass Reflection -->
      <ellipse cx="-10" cy="-10" rx="14" ry="6" transform="rotate(-35, -10, -10)" fill="#ffffff" opacity="0.75"/>
      <!-- Screws / Rivets -->
      <circle cx="0" cy="-33" r="2" fill="#1a1a1a"/>
      <circle cx="23" cy="-23" r="2" fill="#1a1a1a"/>
      <circle cx="33" cy="0" r="2" fill="#1a1a1a"/>
      <circle cx="23" cy="23" r="2" fill="#1a1a1a"/>
      <circle cx="0" cy="33" r="2" fill="#1a1a1a"/>
      <circle cx="-23" cy="23" r="2" fill="#1a1a1a"/>
      <circle cx="-33" cy="0" r="2" fill="#1a1a1a"/>
      <circle cx="-23" cy="-23" r="2" fill="#1a1a1a"/>
    </g>

    <!-- Lower Window -->
    <g transform="translate(0, 35)">
      <circle cx="0" cy="0" r="26" fill="#6c757d" stroke="#1a1a1a" stroke-width="2.5"/>
      <circle cx="0" cy="0" r="18" fill="url(#glassGrad)" stroke="#1a1a1a" stroke-width="1.5"/>
      <ellipse cx="-6" cy="-7" rx="8" ry="4" transform="rotate(-35, -6, -7)" fill="#ffffff" opacity="0.7"/>
    </g>

  </g>
</svg>
